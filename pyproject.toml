[project]
name = "lgraph"
version = "0.1.0"
description = "Research AI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2,<2.0.0",
    "langchain-openrouter>=0.2.8,<0.3.0",
    "langgraph>=1.2.11",
    "lancedb>=0.39,<1",
    "pyarrow>=16",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
ingest = [
    "mineru>=4.0,<5",
    "arxiv>=4,<5",
]
# NVIDIA machines: MinerU's GPU-served models (vLLM on Linux, LMDeploy on
# Windows) for the standard/advanced tiers. Not resolvable on macOS.
ingest-gpu = [
    "mineru[full]>=4.0,<5; sys_platform != 'darwin'",
    "arxiv>=4,<5",
]

[project.scripts]
lgraph = "lgraph.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
